# 外部から取ってくるスキルの一覧。
# apm（AIエージェント用の設定をまとめて管理するツール）がこのファイルを読み、
# 書かれたスキルを ~/.claude/skills/ に配置する。
name: mochimochiki-claude
version: 0.1.0
description: Claude Code の個人設定で使う外部スキル
targets:
  - claude
dependencies:
  apm:
    # デザインまわりのスキル。~/.claude/skills/impeccable/ に入る。
    # git: の形で書くと GitHubのAPIを使わず git だけで取得する。
    # ref: は取得するバージョン。上げたいときはここのタグを差し替える。
    - git: https://github.com/pbakaus/impeccable.git
      ref: skill-v4.0.3
    # 日本語の文章を読みやすく直すスキル。~/.claude/skills/yomiyasu/ に入る。
    # 既存の文章の書き直しを頼まれたときに使う。ふだん書くときの規範は skills/readable/ にある。
    # リポジトリには同じスキルが2か所（直下と skills/yomiyasu/）にある。
    # 丸ごと入れると Claude Code が両方を別のスキルとして読むので、path: で片方だけ入れる。
    - git: https://github.com/nanaism/yomiyasu.git
      path: skills/yomiyasu
      ref: v1.0.3
