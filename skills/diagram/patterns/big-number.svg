<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#f5f6f4"/>
  <title>2025 年の出生率 1.14 は過去最低</title>
  <desc>2025 年の合計特殊出生率 1.14 を大きな数字で示し、右に比べる値を 2 つだけ並べる。前年 2024 年は 1.15、ひのえうまで出生が大きく減った 1966 年は 1.58 で、2025 年はその年よりも低い。グラフにはせず、数字と短い説明だけで主張する。出典は厚生労働省「令和 7(2025)年人口動態統計(確定数)の概況」。</desc>
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1e2733; }
    .h { font-size: 16px; font-weight: 700; fill: #1e2733; }
    .t { font-size: 16px; fill: #1e2733; }
    .s { font-size: 14px; fill: #4a5563; }
    .p { font-size: 14px; font-weight: 700; fill: #2b5c8a; }
    .o { font-size: 14px; font-weight: 700; fill: #9a4a14; }
    .src { font-size: 12px; fill: #4a5563; }
  </style>
  <text x="16" y="40" class="title">2025 年の出生率 1.14 は過去最低</text>
  <text x="16" y="88" class="s">合計特殊出生率(2025 年)</text>
  <text x="12" y="190" font-size="104" font-weight="700" fill="#2b5c8a">1.14</text>
  <text x="16" y="224" class="o">統計を取り始めてから最低</text>
  <path d="M296,76 V232" stroke="#dfe2e6" stroke-width="1.5"/>
  <text x="320" y="88" class="s">比べる値</text>
  <text x="320" y="128" class="t">前年(2024 年)</text>
  <text x="624" y="128" class="h" text-anchor="end">1.15</text>
  <path d="M320,146 H624" stroke="#dfe2e6" stroke-width="1.5"/>
  <text x="320" y="180" class="t">ひのえうまの 1966 年</text>
  <text x="624" y="180" class="h" text-anchor="end">1.58</text>
  <text x="320" y="204" class="s">出生が前年より 25% 減った年</text>
  <text x="16" y="284" class="src">出典 厚生労働省「人口動態統計」2025 年</text>
</svg>
