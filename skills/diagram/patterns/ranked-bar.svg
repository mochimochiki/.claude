<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" width="640" height="348" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <rect x="0" y="0" width="640" height="348" fill="#f5f6f4"/>
  <title>65 歳以上の割合は、日本が世界で最も高い</title>
  <desc>2026 年の総人口に占める 65 歳以上人口の割合の上位 8 か国を、高い順の横棒グラフで示す。日本の棒だけを青で塗り、ほかの 7 か国は灰色にする。日本 29.6%、イタリア 25.6%、ドイツ 24.2%、フランス 22.9%、スペイン 22.2%、韓国 21.4%、カナダ 20.7%、イギリス 19.9%。棒は 0 から始め、値は棒の先に書き、% は先頭の日本にだけ付ける。対象は人口 4000 万以上の 39 か国。日本は人口推計の 2026 年 9 月 15 日現在、他国は国連の World Population Prospects 2024 による 2026 年 7 月 1 日現在の推計値。出典は総務省統計局「統計からみた我が国の高齢者」(統計トピックス No.149)の表 3。</desc>
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1e2733; }
    .h { font-size: 16px; font-weight: 700; fill: #1e2733; }
    .t { font-size: 16px; fill: #1e2733; }
    .s { font-size: 14px; fill: #4a5563; }
    .p { font-size: 14px; font-weight: 700; fill: #2b5c8a; }
    .o { font-size: 14px; font-weight: 700; fill: #9a4a14; }
    .src { font-size: 12px; fill: #4a5563; }
  </style>
  <text x="16" y="40" class="title">65 歳以上の割合は、日本が世界で最も高い</text>
  <text x="102" y="88" class="p" text-anchor="end">日本</text>
  <rect x="112" y="74" width="394.7" height="20" fill="#2b5c8a"/>
  <text x="514.7" y="88" class="p">29.6%</text>
  <text x="102" y="116" class="s" text-anchor="end">イタリア</text>
  <rect x="112" y="102" width="341.3" height="20" fill="#c9ced5"/>
  <text x="461.3" y="116" class="s">25.6</text>
  <text x="102" y="144" class="s" text-anchor="end">ドイツ</text>
  <rect x="112" y="130" width="322.7" height="20" fill="#c9ced5"/>
  <text x="442.7" y="144" class="s">24.2</text>
  <text x="102" y="172" class="s" text-anchor="end">フランス</text>
  <rect x="112" y="158" width="305.3" height="20" fill="#c9ced5"/>
  <text x="425.3" y="172" class="s">22.9</text>
  <text x="102" y="200" class="s" text-anchor="end">スペイン</text>
  <rect x="112" y="186" width="296.0" height="20" fill="#c9ced5"/>
  <text x="416.0" y="200" class="s">22.2</text>
  <text x="102" y="228" class="s" text-anchor="end">韓国</text>
  <rect x="112" y="214" width="285.3" height="20" fill="#c9ced5"/>
  <text x="405.3" y="228" class="s">21.4</text>
  <text x="102" y="256" class="s" text-anchor="end">カナダ</text>
  <rect x="112" y="242" width="276.0" height="20" fill="#c9ced5"/>
  <text x="396.0" y="256" class="s">20.7</text>
  <text x="102" y="284" class="s" text-anchor="end">イギリス</text>
  <rect x="112" y="270" width="265.3" height="20" fill="#c9ced5"/>
  <text x="385.3" y="284" class="s">19.9</text>
  <path d="M112,68 V296" stroke="#4a5563" stroke-width="1.5"/>
  <text x="16" y="316" class="src">2026 年、人口 4000 万以上の 39 か国</text>
  <text x="16" y="334" class="src">出典 総務省統計局 統計からみた我が国の高齢者</text>
</svg>
