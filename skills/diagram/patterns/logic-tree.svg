<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" width="640" height="392" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <title>不具合を作り込みと流出に分け、多い枝から対策する</title>
  <desc>原因の分解木(ロジックツリー)。リリース後の不具合が多いという問題を、開発中に欠陥を作り込む「作り込み」と、テストで検出できない「流出」の 2 つに分ける。作り込みは要件の不明確さと実装の誤りに、流出はテスト漏れと環境の差異に分かれる。対策はそれぞれ、受け入れ条件の確定、影響範囲のレビュー、仕様からのテスト設計、本番相当の検証環境である。対策する前に、不具合ごとに作り込み工程と検出すべきだった工程を記録し、どの枝に多いかを数え、件数の多い枝の対策から着手する。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5563"/>
    </marker>
  </defs>
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1e2733; }
    .h { font-size: 16px; font-weight: 700; fill: #1e2733; }
    .s { font-size: 14px; fill: #4a5563; }
    .t { font-size: 14px; fill: #1e2733; }
    .w { font-size: 16px; font-weight: 700; fill: #ffffff; }
    .tree { stroke: #4a5563; stroke-width: 1.8; fill: none; }
    .line { stroke: #4a5563; stroke-width: 1.5; fill: none; marker-end: url(#a); }
  </style>
  <rect x="0" y="0" width="640" height="392" fill="#f5f6f4"/>

  <text x="16" y="42" class="title">不具合を作り込みと流出に分け、多い枝から対策する</text>

  <rect x="200" y="64" width="240" height="40" rx="20" fill="#1e2733"/>
  <text x="320" y="90" text-anchor="middle" class="w">リリース後の不具合が多い</text>

  <path d="M320,104 V124 M196,124 H484 M196,124 V136 M484,124 V136" class="tree"/>

  <rect x="56" y="136" width="280" height="200" fill="#e3ecf5"/>
  <rect x="344" y="136" width="280" height="200" fill="#fbeee5"/>
  <text x="196" y="164" text-anchor="middle" class="h" style="fill:#2b5c8a">作り込み</text>
  <text x="484" y="164" text-anchor="middle" class="h" style="fill:#9a4a14">流出</text>

  <path d="M196,174 V184 M126,184 H266 M126,184 V196 M266,184 V196" class="tree"/>
  <path d="M484,174 V184 M414,184 H554 M414,184 V196 M554,184 V196" class="tree"/>

  <text x="16" y="220" class="s">原因</text>
  <text x="126" y="220" text-anchor="middle" class="h">要件の不明確さ</text>
  <text x="266" y="220" text-anchor="middle" class="h">実装の誤り</text>
  <text x="414" y="220" text-anchor="middle" class="h">テスト漏れ</text>
  <text x="554" y="220" text-anchor="middle" class="h">環境の差異</text>

  <path d="M126,232 V276" class="line"/>
  <path d="M266,232 V276" class="line"/>
  <path d="M414,232 V276" class="line"/>
  <path d="M554,232 V276" class="line"/>

  <text x="16" y="304" class="s">対策</text>
  <text x="126" y="304" text-anchor="middle" class="t">受け入れ条件の確定</text>
  <text x="266" y="304" text-anchor="middle" class="t">影響範囲のレビュー</text>
  <text x="414" y="304" text-anchor="middle" class="t">仕様からテスト設計</text>
  <text x="554" y="304" text-anchor="middle" class="t">本番相当の検証環境</text>

  <text x="56" y="368" class="s">先に、各不具合がどの枝かを記録して数える</text>
</svg>
