  <path d="M64,160.0 H600" stroke="#dfe2e6" stroke-width="1"/>
  <text x="58" y="165.0" class="s" text-anchor="end">200 万</text>
  <path d="M64,72.0 H600" stroke="#dfe2e6" stroke-width="1"/>
  <text x="58" y="77.0" class="s" text-anchor="end">300 万</text>
