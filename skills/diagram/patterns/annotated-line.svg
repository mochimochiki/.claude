<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 408" width="640" height="408" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <rect x="0" y="0" width="640" height="408" fill="#f5f6f4"/>
  <title>出生数は 10 年続けて減り、67 万人になった</title>
  <desc>1947 年から 2025 年までの出生数の折れ線グラフ。縦軸は 0 から 300 万人。2015 年から 2025 年までの 10 年続けて減った区間を青い太線で、それより前を灰色の細線で描く。注釈は 3 つで、最多の 1949 年(269.7 万人)、ひのえうまで前年より 25% 減った 1966 年(136.1 万人)、最新の 2025 年(67.1 万人)。1972 年までは沖縄県を含まない。出典は厚生労働省「令和 7(2025)年人口動態統計(確定数)の概況」第 2 表。</desc>
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1e2733; }
    .h { font-size: 16px; font-weight: 700; fill: #1e2733; }
    .t { font-size: 16px; fill: #1e2733; }
    .s { font-size: 14px; fill: #4a5563; }
    .p { font-size: 14px; font-weight: 700; fill: #2b5c8a; }
    .o { font-size: 14px; font-weight: 700; fill: #9a4a14; }
    .src { font-size: 12px; fill: #4a5563; }
  </style>
  <text x="16" y="40" class="title">出生数は 10 年続けて減り、67 万人になった</text>
  <path d="M56,336.0 H600" stroke="#dfe2e6" stroke-width="1"/>
  <text x="50" y="341.0" class="s" text-anchor="end">0</text>
  <path d="M56,252.0 H600" stroke="#dfe2e6" stroke-width="1"/>
  <text x="50" y="257.0" class="s" text-anchor="end">100</text>
  <path d="M56,168.0 H600" stroke="#dfe2e6" stroke-width="1"/>
  <text x="50" y="173.0" class="s" text-anchor="end">200</text>
  <path d="M56,84.0 H600" stroke="#dfe2e6" stroke-width="1"/>
  <text x="50" y="89.0" class="s" text-anchor="end">300</text>
  <text x="50" y="66" class="s" text-anchor="end">万人</text>
