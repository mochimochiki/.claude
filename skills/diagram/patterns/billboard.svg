<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <title>AI に任せるほど、人の仕事は確認が中心になる</title>
  <desc>ビルボード型のポスター。左は AI に少し任せるときで、人が資料を作成し、人の仕事の大半は作成である。右は多く任せるときで、AI が作成した資料が並び、人は 1 件ずつ確認し、人の仕事の大半は確認になる。橙は作成、青は確認を表す。帯の幅は考え方を示すもので、測定値ではない。AI が作成した資料を使うかどうかの判断は、任せる作業をいくら増やしても人に残る。</desc>
  <defs>
    <symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="currentColor"/><path d="M4,21 C4,15.5 7.5,13 12,13 C16.5,13 20,15.5 20,21 Z" fill="currentColor"/></symbol>
    <symbol id="document" viewBox="0 0 24 24"><path d="M6,2.5 H14 L19,7.5 V21.5 H6 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14,2.5 V7.5 H19" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9,12 H16 M9,15.5 H16 M9,19 H13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15,15 L21,21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
    <symbol id="ai" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" fill="currentColor"/><text x="12" y="16.2" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif">AI</text></symbol>
  </defs>
  <style>
    .title { font-size: 48px; font-weight: 700; fill: #1e2733; }
    .h { font-size: 28px; font-weight: 700; fill: #1e2733; }
    .s { font-size: 20px; fill: #4a5563; }
    .bt { font-size: 20px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="#f5f6f4"/>

  <text x="64" y="104" class="title">AI に任せるほど、</text>
  <text x="64" y="168" class="title">人の仕事は<tspan fill="#2b5c8a">確認</tspan>が中心になる</text>

  <!-- 左: 少し任せる -->
  <text x="64" y="268" class="h">少し任せる</text>
  <use href="#person" x="64" y="300" width="96" height="96" color="#4a5563"/>
  <use href="#document" x="184" y="316" width="64" height="64" color="#b35a1f"/>
  <use href="#document" x="252" y="316" width="64" height="64" color="#b35a1f"/>
  <text x="188" y="420" class="s" style="fill:#9a4a14">人が作成</text>
  <use href="#ai" x="376" y="324" width="48" height="48" color="#1e2733"/>
  <use href="#document" x="432" y="316" width="64" height="64" color="#7a8490"/>
  <text x="64" y="476" class="s">人の仕事</text>
  <rect x="64" y="490" width="324" height="48" fill="#b35a1f"/>
  <text x="80" y="521" class="bt">作成</text>
  <rect x="388" y="490" width="132" height="48" fill="#2b5c8a"/>
  <text x="404" y="521" class="bt">確認</text>

  <!-- 変化 -->
  <text x="640" y="380" class="h" text-anchor="middle">増やす</text>
  <path d="M564,400 L688,400 L688,382 L724,418 L688,454 L688,436 L564,436 Z" fill="#4a5563"/>

  <!-- 右: 多く任せる -->
  <text x="760" y="268" class="h">多く任せる</text>
  <use href="#ai" x="760" y="300" width="96" height="96" color="#1e2733"/>
  <use href="#document" x="868" y="316" width="64" height="64" color="#7a8490"/>
  <use href="#document" x="932" y="316" width="64" height="64" color="#7a8490"/>
  <use href="#document" x="996" y="316" width="64" height="64" color="#7a8490"/>
  <text x="872" y="420" class="s">AI が作成</text>
  <use href="#search" x="1060" y="316" width="64" height="64" color="#2b5c8a"/>
  <use href="#person" x="1124" y="300" width="96" height="96" color="#4a5563"/>
  <text x="760" y="476" class="s">人の仕事</text>
  <rect x="760" y="490" width="84" height="48" fill="#b35a1f"/>
  <text x="776" y="521" class="bt">作成</text>
  <rect x="844" y="490" width="372" height="48" fill="#2b5c8a"/>
  <text x="860" y="521" class="bt">確認</text>

  <text x="64" y="612" class="s">使うかどうかの判断は人に残る</text>
  <text x="1216" y="612" class="s" text-anchor="end">帯の幅は測定値ではない</text>
</svg>
