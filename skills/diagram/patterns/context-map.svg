<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','IPAPGothic',sans-serif">
  <title>「顧客」が指すものは、コンテキストごとに違う</title>
  <desc>コンテキストマップの作例。営業・請求・サポートの 3 つのコンテキストで、同じ「顧客」という語が別のものを指す。営業では見込み客を含む商談中の会社、請求では契約済みの法人で請求書の送り先、サポートでは問い合わせてきた担当者個人を指す。営業は受注のときに請求へ顧客を登録し、請求はサポートに契約情報を共有する。コンテキスト間の関係は Evans の表記にならい、上流を U、下流を D で示す。Customer/Supplier などの関係のパターン名は省いた。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5563"/>
    </marker>
    <symbol id="people" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3" fill="currentColor"/><path d="M2,19 C2,15 4.5,13 8,13 C11.5,13 14,15 14,19 Z" fill="currentColor"/><circle cx="16.5" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15,12.2 C19,12 22,14 22,18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="document" viewBox="0 0 24 24"><path d="M6,2.5 H14 L19,7.5 V21.5 H6 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14,2.5 V7.5 H19" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9,12 H16 M9,15.5 H16 M9,19 H13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="chat" viewBox="0 0 24 24"><path d="M3,4 H21 V16 H10 L5,20 V16 H3 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  </defs>
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1e2733; }
    .h { font-size: 16px; font-weight: 700; fill: #1e2733; }
    .w { font-size: 16px; font-weight: 700; fill: #9a4a14; }
    .s { font-size: 14px; fill: #4a5563; }
    .ctx { fill: #e8eaed; }
    .line { stroke: #4a5563; stroke-width: 1.8; fill: none; marker-end: url(#a); }
  </style>
  <rect x="0" y="0" width="640" height="360" fill="#f5f6f4"/>

  <text x="16" y="42" class="title">「顧客」が指すものは、コンテキストごとに違う</text>

  <rect x="16" y="72" width="184" height="200" rx="12" class="ctx"/>
  <text x="32" y="100" class="h">営業</text>
  <use href="#people" x="92" y="120" width="32" height="32" color="#4a5563"/>
  <text x="108" y="188" class="w" text-anchor="middle">「顧客」</text>
  <text x="108" y="222" class="h" text-anchor="middle">商談中の会社</text>
  <text x="108" y="246" class="s" text-anchor="middle">見込み客を含む</text>

  <rect x="228" y="72" width="184" height="200" rx="12" class="ctx"/>
  <text x="244" y="100" class="h">請求</text>
  <use href="#document" x="304" y="120" width="32" height="32" color="#4a5563"/>
  <text x="320" y="188" class="w" text-anchor="middle">「顧客」</text>
  <text x="320" y="222" class="h" text-anchor="middle">契約済みの法人</text>
  <text x="320" y="246" class="s" text-anchor="middle">請求書の送り先</text>

  <rect x="440" y="72" width="184" height="200" rx="12" class="ctx"/>
  <text x="456" y="100" class="h">サポート</text>
  <use href="#chat" x="516" y="120" width="32" height="32" color="#4a5563"/>
  <text x="532" y="188" class="w" text-anchor="middle">「顧客」</text>
  <text x="532" y="222" class="h" text-anchor="middle">問い合わせた人</text>
  <text x="532" y="246" class="s" text-anchor="middle">法人の担当者個人</text>

  <path d="M108,272 V308 H300 V274" class="line"/>
  <text x="116" y="294" class="s">U</text>
  <text x="292" y="294" class="s" text-anchor="end">D</text>
  <text x="204" y="334" class="s" text-anchor="middle">受注時に登録する</text>
  <path d="M340,272 V308 H532 V274" class="line"/>
  <text x="348" y="294" class="s">U</text>
  <text x="524" y="294" class="s" text-anchor="end">D</text>
  <text x="436" y="334" class="s" text-anchor="middle">契約情報を共有する</text>
</svg>
