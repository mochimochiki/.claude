<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 564" width="640" height="564" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <title>答える前に社内文書を検索し、結果を AI に渡す</title>
  <desc>4 コマ形式の説明図。RAG(検索拡張生成)で 1 つの質問に答えるまでを上から順に描く。1 コマ目で人が社内の決まりを尋ねる。AI は社内文書を学習していない。2 コマ目で AI とは別の検索の仕組みが、質問をもとに社内文書を検索し、質問に近いチャンク(文書を分けた一部)を見つける。3 コマ目で質問とチャンクを 1 つのプロンプトにまとめて AI に渡す。4 コマ目で AI がチャンクの内容をもとに答え、出典の文書名を添える。橙は質問、青は社内文書から見つけたチャンクを表し、同じ色がコマをまたいで受け渡される。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5563"/>
    </marker>
    <symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="currentColor"/><path d="M4,21 C4,15.5 7.5,13 12,13 C16.5,13 20,15.5 20,21 Z" fill="currentColor"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15,15 L21,21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
    <symbol id="ai" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" fill="currentColor"/><text x="12" y="16.2" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif">AI</text></symbol>
  </defs>
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1e2733; }
    .h { font-size: 16px; font-weight: 700; fill: #1e2733; }
    .s { font-size: 14px; fill: #4a5563; }
    .panel { fill: #fcfcfa; stroke: #7a8490; stroke-width: 1.5; }
    .doc { fill: #fcfcfa; stroke: #7a8490; stroke-width: 1.2; }
    .hit { fill: #e3ecf5; stroke: #2b5c8a; stroke-width: 2.5; }
    .q { fill: #fbeee5; stroke: #b35a1f; stroke-width: 1.8; }
    .qt { font-size: 14px; fill: #9a4a14; }
    .f { fill: #e3ecf5; stroke: #2b5c8a; stroke-width: 1.8; }
    .ft { font-size: 14px; fill: #2b5c8a; }
    .line { stroke: #4a5563; stroke-width: 1.8; fill: none; marker-end: url(#a); }
  </style>
  <rect x="0" y="0" width="640" height="564" fill="#f5f6f4"/>

  <text x="16" y="40" class="title">答える前に社内文書を検索し、結果を AI に渡す</text>

  <!-- 1 コマ目: 質問を受ける -->
  <rect x="16" y="64" width="608" height="112" rx="6" class="panel"/>
  <text x="32" y="126" class="h">質問を受ける</text>
  <use href="#person" x="240" y="84" width="48" height="48" color="#4a5563"/>
  <path d="M320,100 L306,108 L320,114 Z" class="q"/>
  <rect x="320" y="86" width="196" height="40" rx="10" class="q"/>
  <text x="334" y="111" class="qt">在宅勤務の申請先は?</text>
  <use href="#ai" x="556" y="82" width="48" height="48" color="#1e2733"/>
  <text x="320" y="158" class="s">AI は社内文書を知らない</text>

  <!-- 2 コマ目: 社内文書を検索する -->
  <rect x="16" y="188" width="608" height="112" rx="6" class="panel"/>
  <text x="32" y="250" class="h">社内文書を検索する</text>
  <use href="#search" x="212" y="212" width="48" height="48" color="#4a5563"/>
  <path d="M266,236 L326,236" class="line"/>
  <text x="272" y="226" class="s">質問で</text>
  <rect x="330" y="198" width="278" height="64" fill="#e8eaed"/>
  <rect x="344" y="206" width="20" height="22" class="doc"/>
  <rect x="376" y="206" width="20" height="22" class="doc"/>
  <rect x="408" y="206" width="20" height="22" class="hit"/>
  <rect x="440" y="206" width="20" height="22" class="doc"/>
  <rect x="472" y="206" width="20" height="22" class="doc"/>
  <rect x="504" y="206" width="20" height="22" class="doc"/>
  <rect x="536" y="206" width="20" height="22" class="doc"/>
  <rect x="568" y="206" width="20" height="22" class="doc"/>
  <rect x="344" y="234" width="20" height="22" class="doc"/>
  <rect x="376" y="234" width="20" height="22" class="doc"/>
  <rect x="408" y="234" width="20" height="22" class="doc"/>
  <rect x="440" y="234" width="20" height="22" class="doc"/>
  <rect x="472" y="234" width="20" height="22" class="doc"/>
  <rect x="504" y="234" width="20" height="22" class="hit"/>
  <rect x="536" y="234" width="20" height="22" class="doc"/>
  <rect x="568" y="234" width="20" height="22" class="doc"/>
  <rect x="344" y="272" width="12" height="12" class="hit"/>
  <text x="362" y="283" class="ft">質問に近いチャンク</text>

  <!-- 3 コマ目: プロンプトを渡す -->
  <rect x="16" y="312" width="608" height="112" rx="6" class="panel"/>
  <text x="32" y="374" class="h">プロンプトを渡す</text>
  <rect x="300" y="330" width="196" height="22" class="q"/>
  <text x="310" y="346" class="qt">質問</text>
  <rect x="300" y="358" width="196" height="22" class="f"/>
  <text x="310" y="374" class="ft">チャンク</text>
  <rect x="300" y="386" width="196" height="22" class="f"/>
  <text x="310" y="402" class="ft">チャンク</text>
  <path d="M506,368 L550,368" class="line"/>
  <text x="512" y="358" class="s">渡す</text>
  <use href="#ai" x="556" y="344" width="48" height="48" color="#1e2733"/>

  <!-- 4 コマ目: 根拠を示して答える -->
  <rect x="16" y="436" width="608" height="112" rx="6" class="panel"/>
  <text x="32" y="498" class="h">根拠を示して答える</text>
  <use href="#ai" x="248" y="466" width="48" height="48" color="#1e2733"/>
  <path d="M320,482 L306,488 L320,496 Z" fill="#fcfcfa" stroke="#7a8490" stroke-width="1.5"/>
  <rect x="320" y="446" width="216" height="88" rx="10" fill="#fcfcfa" stroke="#7a8490" stroke-width="1.5"/>
  <text x="336" y="474" class="h">申請先は所属長</text>
  <rect x="336" y="488" width="184" height="30" class="f"/>
  <text x="346" y="508" class="ft">出典: 在宅勤務規程</text>
  <use href="#person" x="556" y="466" width="48" height="48" color="#4a5563"/>
</svg>
