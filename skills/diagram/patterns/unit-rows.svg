<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 333" width="640" height="333" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','IPAPGothic',sans-serif">
  <rect x="0" y="0" width="640" height="333" fill="#f5f6f4"/>
  <title>日本は 10 人に 3 人が 65 歳以上で最多</title>
  <desc>2026 年の総人口に占める 65 歳以上人口の割合を、4 か国それぞれ人の記号 10 個の行で示す。記号 1 つが 10% に当たり、割合の分を、日本の行は青、ほかの 3 か国は濃い灰で塗り、残りは薄い灰にする。端数は記号を途中まで塗る。日本 29.6%、イタリア 25.6%、ドイツ 24.2%、アメリカ 18.8%。日本の行だけ国名と値を青で書く。日本は人口推計の 2026 年 9 月 15 日現在、他国は国連の World Population Prospects 2024 による 2026 年 7 月 1 日現在の推計値。出典は総務省統計局「統計からみた我が国の高齢者」(統計トピックス No.149)の表 3。</desc>
