<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 485" width="640" height="485" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','IPAPGothic',sans-serif">
  <rect x="0" y="0" width="640" height="485" fill="#f5f6f4"/>
  <title>粗利 42 億円の 6 割強を、販管費が使っている</title>
  <desc>架空の会社の損益計算書を、5 列のサンキーダイアグラムで示す。3 事業(製品 A 55 億円、製品 B 30 億円、サービス 15 億円)が売上高 100 億円に集まり、売上原価 58 億円と売上総利益 42 億円に分かれる。売上総利益は販管費 27 億円と営業利益 15 億円に分かれ、販管費はさらに人件費 12 億円、広告宣伝費 8 億円、その他 7 億円に分かれる。題の主役の流れ(売上総利益から販管費とその内訳、売上総利益の残りの営業利益)だけを、費用は赤、利益は緑で塗り、ほかの節点と帯は薄い灰にして後ろに下げる。販管費の名前と値は太字にする。売上高から営業利益までの節点に、売上高に対する割合を添える。数値は架空。</desc>
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1e2733; }
    .h { font-size: 16px; font-weight: 700; fill: #1e2733; }
