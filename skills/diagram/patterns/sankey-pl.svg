  <text x="308.0" y="80.0" class="s" text-anchor="middle">売上原価</text>
  <text x="308.0" y="98.0" class="s" text-anchor="middle">58(58%)</text>
  <text x="308.0" y="402.0" class="d" text-anchor="middle">売上総利益</text>
  <text x="308.0" y="419.0" class="d" text-anchor="middle">42(42%)</text>
  <text x="408.0" y="206.0" class="b" text-anchor="middle">販管費</text>
  <text x="408.0" y="224.0" class="b" text-anchor="middle">27(27%)</text>
  <text x="408.0" y="376.0" class="d" text-anchor="middle">営業利益</text>
  <text x="408.0" y="393.0" class="d" text-anchor="middle">15(15%)</text>
  <text x="526" y="252.7" class="d">人件費 12</text>
  <text x="526" y="292.9" class="d">広告宣伝費 8</text>
  <text x="526" y="326.5" class="d">その他 7</text>
  <text x="16" y="451" class="src">単位は億円、かっこ内は売上高に対する割合</text>
