<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" width="640" height="476" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','IPAPGothic',sans-serif">
  <rect x="0" y="0" width="640" height="476" fill="#f5f6f4"/>
  <title>粗利 42 億円の 6 割強を、販管費が使っている</title>
  <desc>架空の会社の損益計算書を、売上高から営業利益までのサンキーダイアグラムで示す。左の 3 事業(製品 A 55 億円、製品 B 30 億円、サービス 15 億円)が売上高 100 億円に集まり、売上原価 58 億円と売上総利益(粗利)42 億円に分かれる。粗利はさらに販管費 27 億円と営業利益 15 億円に分かれる。費用に向かう帯は淡い対の色、利益に向かう帯は淡い主の色にし、販管費の節点と名前を対の色で強調する。帯の太さは金額に比例させる。各節点に売上高に対する割合を添える。数値は架空。</desc>
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1e2733; }
    .h { font-size: 16px; font-weight: 700; fill: #1e2733; }
    .t { font-size: 16px; fill: #1e2733; }
    .s { font-size: 14px; fill: #4a5563; }
    .hp { font-size: 16px; font-weight: 700; fill: #2b5c8a; }
    .p { font-size: 14px; font-weight: 700; fill: #2b5c8a; }
    .o { font-size: 14px; font-weight: 700; fill: #9a4a14; }
    .src { font-size: 12px; fill: #4a5563; }
  </style>
  <text x="16" y="40" class="title">粗利 42 億円の 6 割強を、販管費が使っている</text>
  <path d="M148,92.0 C202.0,92.0 202.0,112.0 256,112.0 V244.0 C202.0,244.0 202.0,224.0 148,224.0 Z" fill="#e3e6ea"/>
  <rect x="128" y="92.0" width="20" height="132.0" fill="#a7b0ba"/>
  <text x="120" y="156.0" class="t" text-anchor="end">製品 A</text>
  <text x="120" y="174.0" class="s" text-anchor="end">55</text>
  <path d="M148,244.0 C202.0,244.0 202.0,244.0 256,244.0 V316.0 C202.0,316.0 202.0,316.0 148,316.0 Z" fill="#e3e6ea"/>
  <rect x="128" y="244.0" width="20" height="72.0" fill="#a7b0ba"/>
  <text x="120" y="278.0" class="t" text-anchor="end">製品 B</text>
  <text x="120" y="296.0" class="s" text-anchor="end">30</text>
  <path d="M148,336.0 C202.0,336.0 202.0,316.0 256,316.0 V352.0 C202.0,352.0 202.0,372.0 148,372.0 Z" fill="#e3e6ea"/>
  <rect x="128" y="336.0" width="20" height="36.0" fill="#a7b0ba"/>
  <text x="120" y="352.0" class="t" text-anchor="end">サービス</text>
  <text x="120" y="370.0" class="s" text-anchor="end">15</text>
  <rect x="256" y="112.0" width="20" height="240.0" fill="#4a5563"/>
  <text x="266.0" y="86" class="h" text-anchor="middle">売上高</text>
  <text x="266.0" y="104" class="s" text-anchor="middle">100</text>
  <path d="M276,112.0 C338.0,112.0 338.0,92.0 400,92.0 V231.2 C338.0,231.2 338.0,251.2 276,251.2 Z" fill="#f2d5c2"/>
  <path d="M276,251.2 C338.0,251.2 338.0,271.2 400,271.2 V372.0 C338.0,372.0 338.0,352.0 276,352.0 Z" fill="#c9d9ea"/>
  <rect x="400" y="92.0" width="20" height="139.2" fill="#a7b0ba"/>
  <text x="428" y="112" class="t">売上原価</text>
  <text x="428" y="130" class="s">58(58%)</text>
  <rect x="400" y="271.2" width="20" height="100.8" fill="#a7b0ba"/>
  <text x="410.0" y="392.0" class="t" text-anchor="middle">売上総利益(粗利)</text>
  <text x="410.0" y="410.0" class="s" text-anchor="middle">42(42%)</text>
  <path d="M420,271.2 C470.0,271.2 470.0,255.2 520,255.2 V320.0 C470.0,320.0 470.0,336.0 420,336.0 Z" fill="#f2d5c2"/>
  <path d="M420,336.0 C470.0,336.0 470.0,344.0 520,344.0 V380.0 C470.0,380.0 470.0,372.0 420,372.0 Z" fill="#c9d9ea"/>
  <rect x="520" y="255.2" width="20" height="64.8" fill="#b35a1f"/>
  <text x="548" y="285.6" class="h" style="fill:#9a4a14">販管費</text>
  <text x="548" y="303.6" class="o">27(27%)</text>
  <rect x="520" y="344.0" width="20" height="36.0" fill="#2b5c8a"/>
  <text x="548" y="360.0" class="hp">営業利益</text>
  <text x="548" y="378.0" class="p">15(15%)</text>
  <text x="16" y="442" class="src">単位は億円、かっこ内は売上高に対する割合</text>
  <text x="16" y="460" class="src">数値は架空</text>
</svg>
