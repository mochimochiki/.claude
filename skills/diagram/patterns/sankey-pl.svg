  <text x="308.0" y="413.0" class="g" text-anchor="middle">42(42%)</text>
  <text x="408.0" y="200.0" class="rb" text-anchor="middle">販管費</text>
  <text x="408.0" y="218.0" class="rb" text-anchor="middle">27(27%)</text>
  <text x="408.0" y="370.0" class="g" text-anchor="middle">営業利益</text>
