<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','IPAPGothic',sans-serif">
  <rect x="0" y="0" width="640" height="372" fill="#f5f6f4"/>
  <title>ロックした項目を除き、個人の設定が優先される</title>
  <desc>設定の継承図の作例。組織・プロジェクト・個人の 3 層の設定を上から順に重ね、言語・通知メール・外部共有の 3 項目について、どの層の値が使われるかを示す。各項目では、値を設定したいちばん下の層の値が使われる。言語は組織が日本語、個人が英語なので英語が使われる。通知メールは組織が毎日、プロジェクトが即時で個人は未設定なので即時が使われる。外部共有は組織が禁止にしてロックしているため、個人が許可にしても使われず、禁止が使われる。使われる値を主の色、ロックのために使われない値を対の色で示す。</desc>
  <defs>
    <symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="currentColor"/><path d="M4,21 C4,15.5 7.5,13 12,13 C16.5,13 20,15.5 20,21 Z" fill="currentColor"/></symbol>
    <symbol id="people" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3" fill="currentColor"/><path d="M2,19 C2,15 4.5,13 8,13 C11.5,13 14,15 14,19 Z" fill="currentColor"/><circle cx="16.5" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15,12.2 C19,12 22,14 22,18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="folder" viewBox="0 0 24 24"><path d="M2.5,6 V19.5 H21.5 V8 H11 L9,5.5 H3 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8,10.5 V7.5 C8,5 9.8,3 12,3 C14.2,3 16,5 16,7.5 V10.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="16" r="1.5" fill="currentColor"/></symbol>
  </defs>
  <style>
    .t { font-size: 20px; font-weight: 700; fill: #1e2733; }
    .h { font-size: 16px; font-weight: 700; fill: #1e2733; }
    .v { font-size: 16px; fill: #4a5563; }
    .s { font-size: 14px; fill: #4a5563; }
    .cell { fill: #fcfcfa; stroke: #7a8490; stroke-width: 1; }
    .empty { fill: none; stroke: #7a8490; stroke-width: 1; stroke-dasharray: 4 3; }
    .win { fill: #e3ecf5; stroke: #2b5c8a; stroke-width: 2; }
    .wv { font-size: 16px; font-weight: 700; fill: #2b5c8a; }
    .res { fill: #2b5c8a; }
    .rv { font-size: 16px; font-weight: 700; fill: #ffffff; }
  </style>
  <text x="16" y="40" class="t">ロックした項目を除き、個人の設定が優先される</text>

  <text x="237" y="84" class="h" text-anchor="middle">言語</text>
  <text x="353" y="84" class="h" text-anchor="middle">通知メール</text>
  <text x="469" y="84" class="h" text-anchor="middle">外部共有</text>

  <rect x="16" y="100" width="514" height="52" rx="8" fill="#e8eaed"/>
  <use href="#people" x="36" y="114" width="24" height="24" color="#4a5563"/>
  <text x="70" y="132" class="h">組織</text>
  <rect x="184" y="106" width="106" height="40" rx="4" class="cell"/>
  <text x="237" y="132" class="v" text-anchor="middle">日本語</text>
  <rect x="300" y="106" width="106" height="40" rx="4" class="cell"/>
  <text x="353" y="132" class="v" text-anchor="middle">毎日</text>
  <rect x="416" y="106" width="106" height="40" rx="4" class="win"/>
  <text x="457" y="132" class="wv" text-anchor="middle">禁止</text>
  <use href="#lock" x="488" y="114" width="24" height="24" color="#1e2733"/>

  <rect x="16" y="160" width="514" height="52" rx="8" fill="#e8eaed"/>
  <use href="#folder" x="36" y="174" width="24" height="24" color="#4a5563"/>
  <text x="70" y="192" class="h">プロジェクト</text>
  <rect x="184" y="166" width="106" height="40" rx="4" class="empty"/>
  <text x="237" y="191" class="s" text-anchor="middle">未設定</text>
  <rect x="300" y="166" width="106" height="40" rx="4" class="win"/>
  <text x="353" y="192" class="wv" text-anchor="middle">即時</text>
  <rect x="416" y="166" width="106" height="40" rx="4" class="empty"/>
  <text x="469" y="191" class="s" text-anchor="middle">未設定</text>

  <rect x="16" y="220" width="514" height="52" rx="8" fill="#e8eaed"/>
  <use href="#person" x="36" y="234" width="24" height="24" color="#4a5563"/>
  <text x="70" y="252" class="h">個人</text>
  <rect x="184" y="226" width="106" height="40" rx="4" class="win"/>
  <text x="237" y="252" class="wv" text-anchor="middle">英語</text>
  <rect x="300" y="226" width="106" height="40" rx="4" class="empty"/>
  <text x="353" y="251" class="s" text-anchor="middle">未設定</text>
  <rect x="416" y="226" width="106" height="40" rx="4" fill="#fbeee5" stroke="#b35a1f" stroke-width="1.5"/>
  <text x="469" y="252" class="v" text-anchor="middle" style="fill:#9a4a14">許可</text>
  <line x1="451" y1="246" x2="487" y2="246" stroke="#9a4a14" stroke-width="2"/>

  <path d="M522,246 H536" stroke="#9a4a14" stroke-width="1" fill="none"/>
  <text x="542" y="242" class="s" style="fill:#9a4a14">ロック中は</text>
  <text x="542" y="262" class="s" style="fill:#9a4a14">使われない</text>

  <line x1="16" y1="290" x2="530" y2="290" stroke="#7a8490" stroke-width="1"/>
  <text x="36" y="334" class="h">使われる値</text>
  <rect x="184" y="308" width="106" height="40" rx="4" class="res"/>
  <text x="237" y="334" class="rv" text-anchor="middle">英語</text>
  <rect x="300" y="308" width="106" height="40" rx="4" class="res"/>
  <text x="353" y="334" class="rv" text-anchor="middle">即時</text>
  <rect x="416" y="308" width="106" height="40" rx="4" class="res"/>
  <text x="469" y="334" class="rv" text-anchor="middle">禁止</text>
</svg>
