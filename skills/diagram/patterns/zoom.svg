<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 484" width="640" height="484" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <title>受注システムは API とワーカーに分かれる</title>
  <desc>ズームの作例で、上段は C4 モデルのシステムコンテキスト図、下段はコンテナ図にあたる。上段はシステム全体で、顧客が受注システムに注文し、受注システムが倉庫管理システムに出荷を依頼する。下段は受注システムだけを拡大した中身である。注文 API が顧客からの注文を受けて受注 DB に保存し、引当の依頼をメッセージキューに入れる。引当ワーカーがキューから依頼を取り出し、倉庫管理システムに出荷を依頼する。C4 モデルで各要素に添える種別・技術・説明の注記は省き、下段では外部の顧客と倉庫管理システムの箱を描かず矢印の先の文字で示した。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5563"/>
    </marker>
    <symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="currentColor"/><path d="M4,21 C4,15.5 7.5,13 12,13 C16.5,13 20,15.5 20,21 Z" fill="currentColor"/></symbol>
    <symbol id="server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="13.5" width="18" height="7.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="7" cy="6.75" r="1.2" fill="currentColor"/><circle cx="7" cy="17.25" r="1.2" fill="currentColor"/></symbol>
    <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12,2.5 V5.5 M12,18.5 V21.5 M2.5,12 H5.5 M18.5,12 H21.5 M5.3,5.3 L7.4,7.4 M16.6,16.6 L18.7,18.7 M5.3,18.7 L7.4,16.6 M16.6,7.4 L18.7,5.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="database" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4,5.5 V18.5 C4,20.2 7.6,21.5 12,21.5 C16.4,21.5 20,20.2 20,18.5 V5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4,12 C4,13.7 7.6,15 12,15 C16.4,15 20,13.7 20,12" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  </defs>
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1e2733; }
    .h { font-size: 16px; font-weight: 700; fill: #1e2733; }
    .s { font-size: 14px; fill: #4a5563; }
    .box { fill: #fcfcfa; stroke: #7a8490; stroke-width: 1.5; }
    .line { stroke: #4a5563; stroke-width: 1.8; fill: none; marker-end: url(#a); }
    .zoom { stroke: #7a8490; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
  </style>
  <rect x="0" y="0" width="640" height="484" fill="#f5f6f4"/>

  <text x="16" y="42" class="title">受注システムは API とワーカーに分かれる</text>

  <!-- システム全体 -->
  <text x="16" y="80" class="s">システム全体</text>
  <use href="#person" x="56" y="100" width="32" height="32" color="#4a5563"/>
  <text x="72" y="154" class="h" text-anchor="middle">顧客</text>
  <rect x="208" y="96" width="160" height="48" rx="8" fill="#e3ecf5" stroke="#2b5c8a" stroke-width="2.5"/>
  <text x="288" y="126" class="h" text-anchor="middle" style="fill:#2b5c8a">受注システム</text>
  <rect x="456" y="96" width="168" height="48" rx="8" fill="#dfe2e6" stroke="#7a8490" stroke-width="1.5"/>
  <text x="540" y="126" class="h" text-anchor="middle">倉庫管理システム</text>
  <path d="M96,120 H206" class="line"/>
  <text x="151" y="110" class="s" text-anchor="middle">注文</text>
  <path d="M368,120 H454" class="line"/>
  <text x="411" y="110" class="s" text-anchor="middle">出荷依頼</text>

  <!-- 拡大の線 -->
  <path d="M208,144 L16,200" class="zoom"/>
  <path d="M368,144 L624,200" class="zoom"/>

  <!-- 受注システムの中 -->
  <rect x="16" y="200" width="608" height="240" rx="12" fill="#e3ecf5"/>
  <text x="32" y="228" class="h" style="fill:#2b5c8a">受注システムの中</text>

  <path d="M18,276 H86" class="line"/>
  <text x="24" y="266" class="s">顧客から</text>
  <rect x="88" y="252" width="136" height="48" rx="8" class="box"/>
  <use href="#server" x="100" y="264" width="24" height="24" color="#4a5563"/>
  <text x="132" y="282" class="h">注文 API</text>

  <path d="M224,276 H302" class="line"/>
  <text x="263" y="266" class="s" text-anchor="middle">引当依頼</text>
  <rect x="304" y="256" width="80" height="40" rx="4" class="box"/>
  <g fill="#e8eaed" stroke="#7a8490" stroke-width="1.2">
    <rect x="311" y="264" width="13" height="24"/><rect x="328" y="264" width="13" height="24"/><rect x="345" y="264" width="13" height="24"/><rect x="362" y="264" width="13" height="24"/>
  </g>
  <text x="344" y="322" class="h" text-anchor="middle">メッセージキュー</text>

  <path d="M384,276 H454" class="line"/>
  <text x="419" y="266" class="s" text-anchor="middle">取り出し</text>
  <rect x="456" y="252" width="160" height="48" rx="8" class="box"/>
  <use href="#gear" x="468" y="264" width="24" height="24" color="#4a5563"/>
  <text x="500" y="282" class="h">引当ワーカー</text>

  <path d="M156,300 V342" class="line"/>
  <text x="164" y="326" class="s">保存</text>
  <use href="#database" x="140" y="346" width="32" height="32" color="#4a5563"/>
  <text x="156" y="400" class="h" text-anchor="middle">受注 DB</text>

  <path d="M536,300 V438" class="line"/>
  <text x="528" y="372" class="s" text-anchor="end">出荷依頼</text>
  <text x="536" y="466" class="s" text-anchor="middle">倉庫管理システムへ</text>
</svg>
