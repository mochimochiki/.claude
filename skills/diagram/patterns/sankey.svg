<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 444" width="640" height="444" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','IPAPGothic',sans-serif">
  <rect x="0" y="0" width="640" height="444" fill="#f5f6f4"/>
  <title>国の予算は、新たな借金と元利払いがほぼ同じ</title>
  <desc>令和 8 年度一般会計予算の歳入と歳出をサンキーダイアグラムで示す。左に歳入の 3 区分(租税及び印紙収入 83.7 兆円、公債金 29.6 兆円、その他収入 9.0 兆円)、中央に総額 122.3 兆円、右に歳出の 5 区分(社会保障 39.1 兆円、国債費 31.3 兆円、地方交付税交付金等 20.9 兆円、防衛関係費 9.0 兆円、その他 22.1 兆円)を置き、帯の太さを金額に比例させる。公債金と国債費の帯だけを主の色にし、新たな借金で賄う額と、過去の借金の元本の返済と利払いに充てる額がほぼ同じことを示す。歳出のその他は、公共事業 6.1 兆円、文教及び科学振興 6.0 兆円、その他 10.0 兆円を合計した。出典は財務省「令和 8 年度一般会計予算 歳出・歳入の構成」。</desc>
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1e2733; }
    .h { font-size: 16px; font-weight: 700; fill: #1e2733; }
    .t { font-size: 16px; fill: #1e2733; }
    .s { font-size: 14px; fill: #4a5563; }
    .hp { font-size: 16px; font-weight: 700; fill: #2b5c8a; }
    .p { font-size: 14px; font-weight: 700; fill: #2b5c8a; }
    .o { font-size: 14px; font-weight: 700; fill: #9a4a14; }
    .src { font-size: 12px; fill: #4a5563; }
  </style>
  <text x="16" y="40" class="title">国の予算は、新たな借金と元利払いがほぼ同じ</text>
  <text x="188" y="64" class="s" text-anchor="end">歳入</text>
  <text x="450" y="64" class="s">歳出</text>
  <path d="M188,76.0 C247.0,76.0 247.0,92.0 306,92.0 V275.5 C247.0,275.5 247.0,259.5 188,259.5 Z" fill="#c9ced5" fill-opacity="0.5"/>
  <rect x="168" y="76.0" width="20" height="183.5" fill="#a7b0ba"/>
  <text x="160" y="168.7" class="t" text-anchor="end">租税及び印紙収入</text>
  <text x="160" y="186.7" class="s" text-anchor="end">83.7</text>
  <path d="M188,275.5 C247.0,275.5 247.0,275.5 306,275.5 V340.3 C247.0,340.3 247.0,340.3 188,340.3 Z" fill="#2b5c8a" fill-opacity="0.35"/>
  <rect x="168" y="275.5" width="20" height="64.8" fill="#2b5c8a"/>
  <text x="160" y="308.9" class="hp" text-anchor="end">公債金(借金)</text>
  <text x="160" y="326.9" class="p" text-anchor="end">29.6</text>
  <path d="M188,356.3 C247.0,356.3 247.0,340.3 306,340.3 V360.0 C247.0,360.0 247.0,376.0 188,376.0 Z" fill="#c9ced5" fill-opacity="0.5"/>
  <rect x="168" y="356.3" width="20" height="19.7" fill="#a7b0ba"/>
  <text x="160" y="367.2" class="t" text-anchor="end">その他収入</text>
  <text x="160" y="385.2" class="s" text-anchor="end">9.0</text>
  <path d="M326,92.0 C388.0,92.0 388.0,76.0 450,76.0 V161.6 C388.0,161.6 388.0,177.6 326,177.6 Z" fill="#c9ced5" fill-opacity="0.5"/>
  <rect x="450" y="76.0" width="20" height="85.6" fill="#a7b0ba"/>
  <text x="478" y="115.8" class="t">社会保障</text>
  <text x="478" y="133.8" class="s">39.1</text>
  <path d="M326,177.6 C388.0,177.6 388.0,169.6 450,169.6 V238.1 C388.0,238.1 388.0,246.1 326,246.1 Z" fill="#2b5c8a" fill-opacity="0.35"/>
  <rect x="450" y="169.6" width="20" height="68.5" fill="#2b5c8a"/>
  <text x="478" y="200.8" class="hp">国債費(元利払い)</text>
  <text x="478" y="218.8" class="p">31.3</text>
  <path d="M326,246.1 C388.0,246.1 388.0,246.1 450,246.1 V291.9 C388.0,291.9 388.0,291.9 326,291.9 Z" fill="#c9ced5" fill-opacity="0.5"/>
  <rect x="450" y="246.1" width="20" height="45.7" fill="#a7b0ba"/>
  <text x="478" y="266.0" class="t">地方交付税交付金等</text>
  <text x="478" y="284.0" class="s">20.9</text>
  <path d="M326,291.9 C388.0,291.9 388.0,299.9 450,299.9 V319.5 C388.0,319.5 388.0,311.5 326,311.5 Z" fill="#c9ced5" fill-opacity="0.5"/>
  <rect x="450" y="299.9" width="20" height="19.7" fill="#a7b0ba"/>
  <text x="478" y="314.7" class="t">防衛関係費 9.0</text>
  <path d="M326,311.5 C388.0,311.5 388.0,327.5 450,327.5 V376.0 C388.0,376.0 388.0,360.0 326,360.0 Z" fill="#c9ced5" fill-opacity="0.5"/>
  <rect x="450" y="327.5" width="20" height="48.5" fill="#a7b0ba"/>
  <text x="478" y="348.8" class="t">その他</text>
  <text x="478" y="366.8" class="s">22.1</text>
  <rect x="306" y="92.0" width="20" height="268.0" fill="#4a5563"/>
  <text x="316.0" y="382.0" class="h" text-anchor="middle">122.3 兆円</text>
  <text x="16" y="410" class="src">令和 8 年度一般会計予算、単位は兆円</text>
  <text x="16" y="428" class="src">出典 財務省「歳出・歳入の構成」</text>
</svg>
