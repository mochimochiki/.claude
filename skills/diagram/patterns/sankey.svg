<svg data-char-limit="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 556" width="640" height="556" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','IPAPGothic',sans-serif">
  <rect x="0" y="0" width="640" height="556" fill="#f5f6f4"/>
  <title>国の予算は、新たな借金と元利払いがほぼ同じ</title>
  <desc>令和 8 年度一般会計予算の歳入と歳出を、5 列のサンキーダイアグラムで示す。左から、税目と公債の種類(所得税 25.3 兆円、法人税 20.7 兆円、消費税 26.7 兆円、その他の税 11.0 兆円、特例公債 22.9 兆円、建設公債 6.7 兆円、その他収入 9.0 兆円)、歳入の区分(租税及び印紙収入 83.7 兆円、公債金 29.6 兆円)、総額 122.3 兆円、歳出の区分(一般歳出 70.2 兆円、国債費 31.3 兆円、地方交付税交付金等 20.9 兆円)、歳出の内訳(社会保障 39.1 兆円、防衛関係費 9.0 兆円、一般歳出のその他 22.1 兆円、債務償還費 18.2 兆円、利払費等 13.1 兆円)の順に並べる。収入は緑、支出は赤で塗る。帯の太さは金額に比例する。一般歳出のその他は、公共事業・文教及び科学振興・その他の合計で、資料の一般歳出の合計から社会保障と防衛関係費を引いた値。租税等は租税及び印紙収入、地方交付税等は地方交付税交付金等の略。出典は財務省「令和 8 年度一般会計予算 歳出・歳入の構成」。借金の流れ(特例公債・建設公債・公債金と、国債費・債務償還費・利払費等)をそれぞれの列の下端に並べ、新たな借金が入る高さと元利払いが出ていく高さをそろえる。この流れだけを収入の緑・支出の赤で塗り、ほかの節点と帯は薄い灰にして後ろに下げる。主役の名前と値は黒の太字、ほかは灰の文字にする。</desc>
