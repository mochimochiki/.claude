  <rect x="0" y="0" width="640" height="413" fill="#f5f6f4"/>
  <title>日本の人口の 10 人に 3 人が 65 歳以上</title>
  <desc>総人口に占める 65 歳以上の割合を、人の記号 100 個で示す絵グラフ。記号 1 つが総人口の 1% に当たり、29.6% を四捨五入した 30 個を青く塗り、残る 70 個を薄い灰色にして後ろに下げる。塗った記号は左の 3 列にまとめ、数えやすくする。記号の上に「65 歳以上」「65 歳未満」と直接書き、凡例は置かず、出典の上に小さく「記号 1 つ = 総人口の 1%」と書く。右に 29.6% と 3624 万人を添える。2026 年 9 月 15 日現在の推計で、出典は総務省統計局「統計からみた我が国の高齢者」(統計トピックス No.149)。</desc>
