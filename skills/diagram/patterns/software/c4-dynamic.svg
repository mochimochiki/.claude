<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 808" width="640" height="808" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','IPAPGothic',sans-serif">
  <title>申請の保存と通知の送信は、キューで分かれている</title>
  <desc>C4 モデルの動的図(dynamic diagram)の作例(架空の経費精算システム)。表記は c4model.com の定義に従い、要素に名前・[種別: 技術]・説明を、関係に番号付きの説明と [技術] を書く。番号はやり取りの順である。システムの境界の中を、利用者の要求の中で行う処理(左)と、要求の後で行う処理(右)の 2 つの区画に分けた。申請者が SPA に申請を入力し(1)、SPA が Web API に送信する(2)。Web API は申請を DB に保存し(3)、提出イベントをメッセージキューに入れる(4)。ここまでが左の区画である。右の区画では、通知ワーカーがキューからイベントを取り出し(5)、メールサーバーに承認依頼を送る(6)。キューへの矢印だけが 2 つの区画をまたぐ。破線の枠は経費精算システムの境界、灰色の塗りの箱はシステムの外にあるものである。C4 モデルは色と形を決めていないため、色と形の割り当ては凡例に書いた。この図は、各コンテナの中の処理と、失敗したときの再送を描いていない。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5563"/>
    </marker>
    <symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="currentColor"/><path d="M4,21 C4,15.5 7.5,13 12,13 C16.5,13 20,15.5 20,21 Z" fill="currentColor"/></symbol>
  </defs>
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1e2733; }
    .h { font-size: 16px; font-weight: 700; fill: #1e2733; }
    .t { font-size: 14px; fill: #1e2733; }
    .s { font-size: 14px; fill: #4a5563; }
    .box { fill: #fcfcfa; stroke: #2b5c8a; stroke-width: 1.5; }
    .ext { fill: #dfe2e6; stroke: #7a8490; stroke-width: 1.5; }
    .bnd { fill: none; stroke: #4a5563; stroke-width: 1.5; stroke-dasharray: 8 5; }
    .zone { fill: #e8eaed; }
    .line { stroke: #4a5563; stroke-width: 1.8; fill: none; marker-end: url(#a); }
  </style>
  <rect x="0" y="0" width="640" height="808" fill="#f5f6f4"/>

  <text x="16" y="40" class="title">申請の保存と通知の送信は、キューで分かれている</text>

  <!-- 人 -->
  <rect x="48" y="64" width="200" height="64" rx="8" class="ext"/>
  <use href="#person" x="64" y="80" width="32" height="32" color="#4a5563"/>
  <text x="108" y="92" class="h">申請者</text>
  <text x="108" y="114" class="s">[Person]</text>

  <!-- システムの境界と 2 つの区画 -->
  <rect x="16" y="160" width="608" height="452" rx="4" class="bnd"/>
  <rect x="32" y="176" width="268" height="396" rx="6" class="zone"/>
  <rect x="340" y="176" width="268" height="396" rx="6" class="zone"/>
  <text x="172" y="200" class="h">要求の中で保存</text>
  <text x="356" y="200" class="h">要求の後で通知</text>
  <text x="32" y="600" class="h">経費精算システム</text>
  <text x="168" y="600" class="s">[Software System]</text>

  <!-- コンテナ -->
  <rect x="48" y="216" width="200" height="72" rx="8" class="box"/>
  <text x="148" y="238" class="h" text-anchor="middle">SPA</text>
  <text x="148" y="258" class="s" text-anchor="middle">[Container: React]</text>
  <text x="148" y="278" class="t" text-anchor="middle">申請画面</text>

  <rect x="48" y="352" width="200" height="72" rx="8" class="box"/>
  <text x="148" y="374" class="h" text-anchor="middle">Web API</text>
  <text x="148" y="394" class="s" text-anchor="middle">[Container: C#]</text>
  <text x="148" y="414" class="t" text-anchor="middle">申請を受け付ける</text>

  <path d="M48,496 V548 A100,9 0 0 0 248,548 V496" fill="#fcfcfa" stroke="#2b5c8a" stroke-width="1.5"/>
  <ellipse cx="148" cy="496" rx="100" ry="9" fill="#fcfcfa" stroke="#2b5c8a" stroke-width="1.5"/>
  <text x="148" y="528" class="h" text-anchor="middle">DB</text>
  <text x="148" y="548" class="s" text-anchor="middle">[Container: PostgreSQL]</text>

  <rect x="392" y="352" width="200" height="72" rx="8" class="box"/>
  <text x="492" y="374" class="h" text-anchor="middle">メッセージキュー</text>
  <text x="492" y="394" class="s" text-anchor="middle">[Container: RabbitMQ]</text>
  <text x="492" y="414" class="t" text-anchor="middle">提出イベント</text>

  <rect x="392" y="488" width="200" height="72" rx="8" class="box"/>
  <text x="492" y="510" class="h" text-anchor="middle">通知ワーカー</text>
  <text x="492" y="530" class="s" text-anchor="middle">[Container: C#]</text>
  <text x="492" y="550" class="t" text-anchor="middle">承認依頼を通知する</text>

  <rect x="392" y="672" width="200" height="72" rx="8" class="ext"/>
  <text x="492" y="694" class="h" text-anchor="middle">メールサーバー</text>
  <text x="492" y="714" class="s" text-anchor="middle">[Software System]</text>
  <text x="492" y="734" class="t" text-anchor="middle">社内の既存システム</text>

  <!-- 関係 -->
  <path d="M148,128 V214" class="line"/>
  <text x="156" y="152" class="t">1. 申請を入力する</text>
  <path d="M148,288 V350" class="line"/>
  <text x="156" y="308" class="t">2. 申請を送信する</text>
  <text x="156" y="326" class="s">[JSON/HTTPS]</text>
  <path d="M148,424 V485" class="line"/>
  <text x="156" y="452" class="t">3. 申請を保存する</text>
  <text x="156" y="472" class="s">[SQL/TCP]</text>
  <path d="M248,388 H390" class="line"/>
  <text x="320" y="346" class="t" text-anchor="middle">4. 提出イベントを入れる</text>
  <text x="320" y="410" class="s" text-anchor="middle">[AMQP]</text>
  <path d="M492,488 V426" class="line"/>
  <text x="500" y="452" class="t">5. 取り出す</text>
  <text x="500" y="472" class="s">[AMQP]</text>
  <path d="M492,560 V670" class="line"/>
  <text x="500" y="634" class="t">6. 承認依頼を送る</text>
  <text x="500" y="654" class="s">[SMTP]</text>

  <!-- 凡例 -->
  <line x1="16" y1="766" x2="624" y2="766" stroke="#7a8490" stroke-width="1"/>
  <rect x="16" y="778" width="32" height="18" rx="4" class="box"/>
  <text x="56" y="792" class="s">コンテナ</text>
  <rect x="136" y="778" width="32" height="18" rx="4" class="ext"/>
  <text x="176" y="792" class="s">システムの外</text>
  <rect x="290" y="778" width="32" height="18" class="bnd"/>
  <text x="330" y="792" class="s">システムの境界</text>
  <text x="456" y="792" class="s">番号: やり取りの順</text>
</svg>
