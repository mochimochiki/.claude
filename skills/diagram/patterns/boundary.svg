<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','IPAPGothic',sans-serif">
  <title>AI が書いたコードは隔離して実行する</title>
  <desc>構成と境界の作例。AnswerScout が利用者の PC で動く範囲を示す。入力データはランナーに取り込まれ、ランナーが Copilot CLI に依頼を渡す。Copilot CLI は読んだ内容を PC の外の推論サーバーへ送り、作業フォルダに書き込み、ランチャーを起動する。書き込めるのは作業フォルダだけである。ランチャーは AI が書いたコードを AppContainer の中で実行する。AppContainer は OS が隔離し、通信できない。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5563"/>
    </marker>
    <symbol id="document" viewBox="0 0 24 24"><path d="M6,2.5 H14 L19,7.5 V21.5 H6 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14,2.5 V7.5 H19" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9,12 H16 M9,15.5 H16 M9,19 H13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="mail" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3,6 L12,13 L21,6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="13.5" width="18" height="7.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="7" cy="6.75" r="1.2" fill="currentColor"/><circle cx="7" cy="17.25" r="1.2" fill="currentColor"/></symbol>
    <symbol id="folder" viewBox="0 0 24 24"><path d="M2.5,6 V19.5 H21.5 V8 H11 L9,5.5 H3 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="ai" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" fill="currentColor"/><text x="12" y="16.2" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif">AI</text></symbol>
  </defs>
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1e2733; }
    .h { font-size: 16px; font-weight: 700; fill: #1e2733; }
    .s { font-size: 14px; fill: #4a5563; }
    .box { fill: #fcfcfa; stroke: #7a8490; stroke-width: 1.5; }
    .line { stroke: #4a5563; stroke-width: 1.8; fill: none; marker-end: url(#a); }
  </style>
  <rect x="0" y="0" width="640" height="560" fill="#f5f6f4"/>

  <text x="16" y="42" class="title">AI が書いたコードは隔離して実行する</text>

  <use href="#mail" x="152" y="62" width="32" height="32" color="#4a5563"/>
  <text x="168" y="114" class="h" text-anchor="middle">入力データ</text>
  <use href="#server" x="472" y="62" width="32" height="32" color="#4a5563"/>
  <text x="488" y="114" class="h" text-anchor="middle">推論サーバー</text>

  <rect x="16" y="136" width="608" height="408" rx="12" fill="#e8eaed"/>
  <text x="32" y="164" class="h">利用者の PC</text>

  <rect x="88" y="188" width="160" height="48" rx="8" class="box"/>
  <text x="168" y="218" class="h" text-anchor="middle">ランナー</text>
  <rect x="400" y="188" width="176" height="48" rx="8" class="box"/>
  <use href="#ai" x="416" y="200" width="24" height="24" color="#1e2733"/>
  <text x="450" y="218" class="h">Copilot CLI</text>

  <use href="#folder" x="152" y="300" width="32" height="32" color="#2b5c8a"/>
  <text x="168" y="352" class="h" text-anchor="middle" style="fill:#2b5c8a">作業フォルダ</text>
  <text x="168" y="374" class="s" text-anchor="middle">書き込めるのはここだけ</text>

  <rect x="400" y="308" width="176" height="48" rx="8" class="box"/>
  <text x="488" y="338" class="h" text-anchor="middle">ランチャー</text>

  <rect x="232" y="400" width="376" height="128" rx="10" fill="#e3ecf5" stroke="#2b5c8a" stroke-width="2.5"/>
  <text x="248" y="428" class="h" style="fill:#2b5c8a">AppContainer</text>
  <text x="248" y="450" class="s">OS が隔離・通信不可</text>
  <use href="#document" x="472" y="462" width="32" height="32" color="#1e2733"/>
  <text x="488" y="514" class="h" text-anchor="middle">AI が書いたコード</text>

  <path d="M168,122 V186" class="line"/>
  <text x="176" y="166" class="s">取り込む</text>
  <path d="M488,186 V124" class="line"/>
  <text x="480" y="166" class="s" text-anchor="end">内容を送る</text>
  <path d="M248,212 H398" class="line"/>
  <text x="324" y="202" class="s" text-anchor="middle">依頼を渡す</text>
  <path d="M448,236 V268 H168 V298" class="line"/>
  <text x="308" y="260" class="s" text-anchor="middle">書き込む</text>
  <path d="M528,236 V306" class="line"/>
  <text x="536" y="276" class="s">起動する</text>
  <path d="M488,356 V458" class="line"/>
  <text x="480" y="384" class="s" text-anchor="end">実行する</text>
</svg>
