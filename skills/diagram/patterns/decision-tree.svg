<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" width="640" height="432" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <title>画面が結果を待つ処理だけを同期で呼ぶ</title>
  <desc>決定木の作例。注文確定のあとに行う処理の呼び出し方を、2 つの問いで決める。画面が結果を待つ処理は同期 API で呼ぶ(例は在庫の引当)。待たない処理のうち、1 件ずつすぐ処理するものはメッセージキューに入れる(例は確認メールの送信)。そうでないものは夜間バッチでまとめて処理する(例は売上の集計)。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5563"/>
    </marker>
    <symbol id="screen" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5,21 H15.5 M12,17 V21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="queue" viewBox="0 0 24 24"><rect x="2.5" y="6.5" width="19" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.8,6.5 V17.5 M15.2,6.5 V17.5" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12,7 V12 L15.5,14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1e2733; }
    .h { font-size: 16px; font-weight: 700; fill: #1e2733; }
    .s { font-size: 14px; fill: #4a5563; }
    .box { fill: #fcfcfa; stroke: #7a8490; stroke-width: 1.5; }
    .q { fill: #e3ecf5; stroke: #2b5c8a; stroke-width: 1.5; }
    .line { stroke: #4a5563; stroke-width: 1.8; fill: none; marker-end: url(#a); }
  </style>
  <rect x="0" y="0" width="640" height="432" fill="#f5f6f4"/>

  <text x="16" y="42" class="title">画面が結果を待つ処理だけを同期で呼ぶ</text>

  <!-- 起点 -->
  <rect x="72" y="68" width="160" height="40" rx="20" fill="#e8eaed" stroke="#7a8490" stroke-width="1.5"/>
  <text x="152" y="94" class="h" text-anchor="middle">注文確定後の処理</text>
  <path d="M152,108 V140" class="line"/>

  <!-- 問い 1 -->
  <path d="M60,142 H244 L264,166 L244,190 H60 L40,166 Z" class="q"/>
  <text x="152" y="172" class="h" text-anchor="middle">画面が結果を待つか</text>
  <path d="M264,166 H350" class="line"/>
  <text x="307" y="156" class="s" text-anchor="middle">はい</text>

  <rect x="352" y="142" width="256" height="48" rx="8" fill="#1e2733"/>
  <use href="#screen" x="368" y="154" width="24" height="24" color="#ffffff"/>
  <text x="400" y="172" class="h" style="fill:#ffffff">同期 API で呼ぶ</text>
  <text x="368" y="212" class="s">例: 在庫の引当</text>

  <path d="M152,190 V238" class="line"/>
  <text x="160" y="220" class="s">いいえ</text>

  <!-- 問い 2 -->
  <path d="M60,240 H244 L264,264 L244,288 H60 L40,264 Z" class="q"/>
  <text x="152" y="270" class="h" text-anchor="middle">1 件ずつすぐ処理するか</text>
  <path d="M264,264 H350" class="line"/>
  <text x="307" y="254" class="s" text-anchor="middle">はい</text>

  <rect x="352" y="240" width="256" height="48" rx="8" class="box"/>
  <use href="#queue" x="368" y="252" width="24" height="24" color="#4a5563"/>
  <text x="400" y="270" class="h">メッセージキューに入れる</text>
  <text x="368" y="310" class="s">例: 確認メールの送信</text>

  <path d="M152,288 V362 H350" class="line"/>
  <text x="160" y="330" class="s">いいえ</text>

  <rect x="352" y="338" width="256" height="48" rx="8" class="box"/>
  <use href="#clock" x="368" y="350" width="24" height="24" color="#4a5563"/>
  <text x="400" y="368" class="h">夜間バッチで処理する</text>
  <text x="368" y="408" class="s">例: 売上の集計</text>
</svg>
