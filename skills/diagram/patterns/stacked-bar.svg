<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 334" width="640" height="334" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','IPAPGothic',sans-serif">
  <rect x="0" y="0" width="640" height="334" fill="#f5f6f4"/>
  <title>65 歳以上の割合は、女性が 6 ポイント高い</title>
  <desc>2026 年 9 月 15 日現在の年齢 3 区分別人口の割合を、男女計・男性・女性の 3 本の帯グラフで示す。65 歳以上を左端にそろえて青で塗り、15～64 歳と 15 歳未満は灰色にする。男性と女性のあいだに寸法線を引き、男性の 65 歳以上の右端から女性の 65 歳以上の右端までの差 6.3 ポイントを示す。寸法線は注釈なので補足の色で引き、差の値は主張の数なので主の色で書く。65 歳以上は男女計 29.6%、男性 26.3%、女性 32.6% で、女性が男性より 6.3 ポイント高い。出典は総務省統計局「統計からみた我が国の高齢者」(統計トピックス No.149)の表 1。</desc>
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1e2733; }
    .h { font-size: 16px; font-weight: 700; fill: #1e2733; }
    .t { font-size: 16px; fill: #1e2733; }
    .s { font-size: 14px; fill: #4a5563; }
    .hp { font-size: 16px; font-weight: 700; fill: #2b5c8a; }
    .p { font-size: 14px; font-weight: 700; fill: #2b5c8a; }
    .o { font-size: 14px; font-weight: 700; fill: #9a4a14; }
    .d { font-size: 14px; fill: #1e2733; }
    .b { font-size: 14px; font-weight: 700; fill: #1e2733; }
    .src { font-size: 12px; fill: #4a5563; }
    .halo { paint-order: stroke; stroke: #f5f6f4; stroke-width: 6px; stroke-linejoin: round; }
  </style>
  <text x="16" y="40" class="title">65 歳以上の割合は、女性が 6 ポイント高い</text>
  <text x="76" y="80" class="p">65 歳以上</text>
  <text x="401.8" y="80" class="s" text-anchor="middle">15～64 歳</text>
  <text x="624" y="80" class="s" text-anchor="end">15 歳未満</text>
  <text x="64" y="120.0" class="t" text-anchor="end">男女計</text>
  <rect x="76" y="96" width="161.2" height="36" fill="#2b5c8a"/>
  <rect x="239.2" y="96" width="325.2" height="36" fill="#c9ced5"/>
  <rect x="566.4" y="96" width="57.6" height="36" fill="#e3e6ea"/>
  <text x="86" y="120.0" font-size="16" font-weight="700" fill="#ffffff">29.6%</text>
  <text x="248.2" y="120.0" class="s">59.7%</text>
  <text x="594.7" y="120.0" class="s" text-anchor="middle">10.7%</text>
  <text x="64" y="188.0" class="t" text-anchor="end">男性</text>
  <rect x="76" y="164" width="143.1" height="36" fill="#2b5c8a"/>
  <rect x="221.1" y="164" width="340.0" height="36" fill="#c9ced5"/>
  <rect x="563.1" y="164" width="60.9" height="36" fill="#e3e6ea"/>
  <text x="86" y="188.0" font-size="16" font-weight="700" fill="#ffffff">26.3%</text>
  <text x="230.1" y="188.0" class="s">62.4%</text>
  <text x="593.0" y="188.0" class="s" text-anchor="middle">11.3%</text>
  <text x="64" y="256.0" class="t" text-anchor="end">女性</text>
  <rect x="76" y="232" width="177.6" height="36" fill="#2b5c8a"/>
  <rect x="255.6" y="232" width="311.5" height="36" fill="#c9ced5"/>
  <rect x="569.1" y="232" width="54.9" height="36" fill="#e3e6ea"/>
  <text x="86" y="256.0" font-size="16" font-weight="700" fill="#ffffff">32.6%</text>
  <text x="264.6" y="256.0" class="s">57.2%</text>
  <text x="596.1" y="256.0" class="s" text-anchor="middle">10.2%</text>
  <path d="M219.1,209.0 V223.0 M253.6,209.0 V223.0 M219.1,216.0 H253.6" fill="none" stroke="#4a5563" stroke-width="1.5"/>
  <text x="261.6" y="221.0" class="p">6.3 ポイント</text>
  <text x="16" y="300" class="src">2026 年 9 月 15 日現在</text>
  <text x="16" y="318" class="src">出典 総務省統計局「統計からみた我が国の高齢者」</text>
</svg>
