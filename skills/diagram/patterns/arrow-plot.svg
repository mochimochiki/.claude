  <text x="92.0" y="368" class="s" text-anchor="middle">0</text>
  <path d="M253.3,90 V350" stroke="#dfe2e6" stroke-width="1"/>
  <text x="253.3" y="368" class="s" text-anchor="middle">4</text>
  <path d="M414.7,90 V350" stroke="#dfe2e6" stroke-width="1"/>
  <text x="414.7" y="368" class="s" text-anchor="middle">8</text>
  <path d="M576.0,90 V350" stroke="#dfe2e6" stroke-width="1"/>
  <text x="576.0" y="368" class="s" text-anchor="middle">12</text>
  <text x="588.0" y="368" class="s">万人</text>
  <text x="80" y="105" class="t" text-anchor="end">東京都</text>
  <circle cx="548.5" cy="100" r="4" fill="#7a8490"/>
  <path d="M542.5,100 H435.2" stroke="#2b5c8a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="558.5" y="105" class="s">−25%</text>
