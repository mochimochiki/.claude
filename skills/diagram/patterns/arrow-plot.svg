<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 428" width="640" height="428" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','IPAPGothic',sans-serif">
  <rect x="0" y="0" width="640" height="428" fill="#f5f6f4"/>
  <title>10 都道府県とも、出生数が 2 割以上減った</title>
  <desc>2025 年の出生数が多い順に 10 都道府県を並べ、2015 年の出生数から 2025 年の出生数へ矢印を引く arrow plot。どの都道府県も矢印は左向きで、減少率は東京都の 24.8% から北海道の 40.6% まで。横軸は 0 から 12 万人。凡例は置かず、先頭の東京都の点と矢じりの上に年を書く。値は 2015 年が平成 27 年人口動態統計(確定数)、2025 年が令和 7 年人口動態統計(確定数)の都道府県別の出生数。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b5c8a"/></marker>
  </defs>
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1e2733; }
    .h { font-size: 16px; font-weight: 700; fill: #1e2733; }
    .t { font-size: 16px; fill: #1e2733; }
    .s { font-size: 14px; fill: #4a5563; }
    .hp { font-size: 16px; font-weight: 700; fill: #2b5c8a; }
    .p { font-size: 14px; font-weight: 700; fill: #2b5c8a; }
    .o { font-size: 14px; font-weight: 700; fill: #9a4a14; }
    .d { font-size: 14px; fill: #1e2733; }
    .b { font-size: 14px; font-weight: 700; fill: #1e2733; }
    .src { font-size: 12px; fill: #4a5563; }
    .halo { paint-order: stroke; stroke: #f5f6f4; stroke-width: 6px; stroke-linejoin: round; }
  </style>
  <text x="16" y="40" class="title">10 都道府県とも、出生数が 2 割以上減った</text>
  <path d="M92.0,86 V344" stroke="#dfe2e6" stroke-width="1"/>
  <text x="92.0" y="362" class="s" text-anchor="middle">0</text>
  <path d="M253.3,86 V344" stroke="#dfe2e6" stroke-width="1"/>
  <text x="253.3" y="362" class="s" text-anchor="middle">4</text>
  <path d="M414.7,86 V344" stroke="#dfe2e6" stroke-width="1"/>
  <text x="414.7" y="362" class="s" text-anchor="middle">8</text>
  <path d="M576.0,86 V344" stroke="#dfe2e6" stroke-width="1"/>
  <text x="576.0" y="362" class="s" text-anchor="middle">12</text>
  <text x="588.0" y="362" class="s">万人</text>
  <text x="80" y="99" class="t" text-anchor="end">東京都</text>
  <circle cx="548.5" cy="94" r="4" fill="#7a8490"/>
  <path d="M542.5,94 H435.2" stroke="#2b5c8a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="558.5" y="99" class="s halo">−25%</text>
  <text x="548.5" y="80" class="s" text-anchor="middle">2015 年</text>
  <text x="439.2" y="80" class="p" text-anchor="middle">2025 年</text>
  <text x="80" y="125" class="t" text-anchor="end">大阪府</text>
