  <circle cx="240.0" cy="302" r="4" fill="#7a8490"/>
  <path d="M234.0,302 H179.9" stroke="#2b5c8a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="250.0" y="307" class="s halo">−41%</text>
  <text x="80" y="333" class="t" text-anchor="end">静岡県</text>
