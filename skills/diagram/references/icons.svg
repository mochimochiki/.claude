    <use href="#chat" x="340" y="164" width="40" height="40"/><text x="360" y="226" class="l" text-anchor="middle">chat</text>
    <use href="#key" x="440" y="164" width="40" height="40"/><text x="460" y="226" class="l" text-anchor="middle">key</text>
    <use href="#lock" x="540" y="164" width="40" height="40"/><text x="560" y="226" class="l" text-anchor="middle">lock</text>

    <use href="#cloud" x="40" y="256" width="40" height="40"/><text x="60" y="318" class="l" text-anchor="middle">cloud</text>
    <use href="#clock" x="140" y="256" width="40" height="40"/><text x="160" y="318" class="l" text-anchor="middle">clock</text>
    <use href="#search" x="240" y="256" width="40" height="40"/><text x="260" y="318" class="l" text-anchor="middle">search</text>
    <use href="#gear" x="340" y="256" width="40" height="40"/><text x="360" y="318" class="l" text-anchor="middle">gear</text>
    <use href="#package" x="440" y="256" width="40" height="40"/><text x="460" y="318" class="l" text-anchor="middle">package</text>
    <use href="#truck" x="540" y="256" width="40" height="40"/><text x="560" y="318" class="l" text-anchor="middle">truck</text>
  </g>
  <use href="#ok" x="40" y="340" width="32" height="32" color="#2b5c8a"/><text x="80" y="362" class="l">ok</text>
  <use href="#partial" x="140" y="340" width="32" height="32" color="#4a5563"/><text x="180" y="362" class="l">partial</text>
  <use href="#ng" x="240" y="340" width="32" height="32" color="#b35a1f"/><text x="280" y="362" class="l">ng</text>
  <use href="#warning" x="340" y="340" width="32" height="32" color="#b35a1f"/><text x="380" y="362" class="l">warning</text>
  <use href="#ai" x="440" y="340" width="32" height="32" color="#1e2733"/><text x="480" y="362" class="l">ai</text>
  <use href="#queue" x="540" y="340" width="32" height="32" color="#1e2733"/><text x="580" y="362" class="l">queue</text>
</svg>
